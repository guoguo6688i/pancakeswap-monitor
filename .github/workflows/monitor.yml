name: PancakeSwap IFO Monitor

on:
  schedule:
    - cron: '30 */4 * * *'  # 每4小时运行一次（错开OKB监测的整点）
  workflow_dispatch:  # 支持手动触发

env:
  TZ: Asia/Shanghai

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache monitor state
        uses: actions/cache@v4
        with:
          path: .pancakeswap_last_tweets.json
          key: pancakeswap-monitor-state-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Run PancakeSwap monitor
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_ENABLED: 'true'
        run: |
          python monitor_pancakeswap.py
